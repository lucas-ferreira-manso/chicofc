<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#2d5fa6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d7a2d"/>
      <stop offset="100%" stop-color="#1e5a1e"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Stadium stands suggestion (upper area) -->
  <ellipse cx="400" cy="80" rx="420" ry="120" fill="#1a2e4a" opacity="0.7"/>
  <ellipse cx="400" cy="60" rx="360" ry="80" fill="#243550" opacity="0.5"/>

  <!-- Field -->
  <ellipse cx="400" cy="420" rx="380" ry="220" fill="url(#grass)"/>

  <!-- Stripes on field -->
  <ellipse cx="400" cy="420" rx="370" ry="210" fill="none" stroke="#267326" stroke-width="20" opacity="0.5"/>
  <ellipse cx="400" cy="420" rx="340" ry="185" fill="#246b24" opacity="0.3"/>
  <ellipse cx="400" cy="420" rx="310" ry="160" fill="none" stroke="#267326" stroke-width="20" opacity="0.5"/>
  <ellipse cx="400" cy="420" rx="280" ry="135" fill="#246b24" opacity="0.3"/>

  <!-- Field lines (white) -->
  <!-- Outer boundary -->
  <ellipse cx="400" cy="400" rx="340" ry="195" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <!-- Center circle -->
  <circle cx="400" cy="400" r="60" fill="none" stroke="white" stroke-width="2.5" opacity="0.7"/>
  <!-- Center spot -->
  <circle cx="400" cy="400" r="4" fill="white" opacity="0.8"/>
  <!-- Center line (horizontal) -->
  <line x1="62" y1="400" x2="738" y2="400" stroke="white" stroke-width="2.5" opacity="0.7"/>

  <!-- Penalty areas -->
  <!-- Left -->
  <rect x="62" y="340" width="100" height="120" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Right -->
  <rect x="638" y="340" width="100" height="120" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>

  <!-- Goals -->
  <rect x="45" y="375" width="20" height="50" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <rect x="735" y="375" width="20" height="50" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>

  <!-- Stadium lights glow effect -->
  <circle cx="120" cy="120" r="40" fill="white" opacity="0.08"/>
  <circle cx="680" cy="120" r="40" fill="white" opacity="0.08"/>
  <circle cx="120" cy="120" r="8" fill="white" opacity="0.3"/>
  <circle cx="680" cy="120" r="8" fill="white" opacity="0.3"/>
</svg>
